            /* 🌟 Encabezado infantil */
            /* Contenedor*/
            .brand-header-kids {
                position: relative;
                overflow: hidden;

                border-radius: 22px;
                margin-bottom: 12px;
                background: linear-gradient(135deg, #93c5fd, #60a5fa, #2563eb);
                border: 2px solid rgba(255, 255, 255, .65);
                box-shadow: 0 14px 28px rgba(37, 99, 235, .25);
                color: #fff;
            }

            /* ✅ Clickable (ir a index.html) */
            .brand-header-kids.clickable {
                cursor: pointer;
                user-select: none;
                transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            }

            .brand-header-kids.clickable:hover {
                transform: translateY(-1px);
                filter: brightness(1.02);
                box-shadow: 0 18px 34px rgba(37, 99, 235, .28);
            }

            .brand-header-kids.clickable:active {
                transform: translateY(0px) scale(0.995);
            }

            /* Para que el click funcione aunque toques estrellas/burbujas */
            .brand-header-kids .bubble,
            .brand-header-kids .star {
                pointer-events: none;
            }

            .brand-row {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .kids-badge {
                width: 52px;
                height: 52px;
                border-radius: 18px;
                display: grid;
                place-items: center;
                font-size: 1.55rem;
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .35);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
            }

            .kids-title {
                font-weight: 950;
                font-size: 1.55rem;
                letter-spacing: .02em;
                line-height: 1.05;
                text-shadow: 0 2px 0 rgba(0, 0, 0, .12);
            }

            .kids-subtitle {
                margin-top: 4px;
                font-size: .9rem;
                font-weight: 750;
                opacity: .95;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .kids-pill {
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .35);
                padding: 4px 10px;
                border-radius: 999px;
                font-size: .82rem;
                font-weight: 850;
            }

            /* ⭐ estrellas (si las quieres) */
            .star {
                position: absolute;
                z-index: 1;
                opacity: .9;
                filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .12));
                animation: twinkle 2.8s ease-in-out infinite;
                pointer-events: none;
            }

            .star.s1 {
                top: 8px;
                right: 18px;
                font-size: 1.15rem;
                animation-delay: 0s;
            }

            .star.s2 {
                top: 40px;
                right: 60px;
                font-size: .95rem;
                animation-delay: .6s;
            }

            .star.s3 {
                bottom: 12px;
                right: 26px;
                font-size: 1.25rem;
                animation-delay: 1.1s;
            }

            /* Estilo base de burbuja + animación*/
            .bubble {
                position: absolute;
                z-index: 0;
                border-radius: 999px;
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .28);
                box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45);
                pointer-events: none;

                /* mejor compatibilidad */
                -webkit-backdrop-filter: blur(2px);
                backdrop-filter: blur(2px);

                animation: floaty 6s ease-in-out infinite;
            }

            /* Posición de cada burbuja*/
            .b1 {
                left: -16px;
                top: -18px;
                animation-delay: 0s;
                transform: rotate(5deg);
                width: 84px;
                height: 84px;
            }

            .b2 {
                left: 40px;
                bottom: -22px;
                width: 52px;
                height: 52px;
                animation-delay: .8s;
            }

            .b3 {
                right: -22px;
                bottom: -26px;
                width: 76px;
                height: 76px;
                animation-delay: 1.3s;
            }

            /* Movimiento flotante*/
            @keyframes floaty {
                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(-8px) scale(1.03);
                }
            }

                background: #eff6ff;
                border: 1px solid #bfdbfe;
                padding: 10px;

            .progress {

                background: #e5e7eb;
                border-radius: 999px;
                overflow: hidden;
            }

            .progress-inner {
                height: 100%;
                width: 0%;
                border-radius: 999px;
                background: linear-gradient(90deg, #60a5fa, #2563eb);
                transition: width 0.2s ease;
            }

            .card {
                border-radius: 20px;
                padding: 5px;
                background: #f9fafb;
                border: 1px solid #e5e7eb;
                margin-bottom: 5px;
                transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            }

            .card.correct {
                animation: pulse 0.4s ease;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
            }

            .card.wrong {
                animation: shake 0.3s ease;
                border-color: #ef4444;
                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3);
            }

            @keyframes pulse {
                0% { transform: scale(1) }
                50% { transform: scale(1.03) }
                100% { transform: scale(1) }
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0) }
                20% { transform: translateX(-4px) }
                40% { transform: translateX(4px) }
                60% { transform: translateX(-4px) }
                80% { transform: translateX(4px) }
            }

            .emoji-container {

            .option-btn {

            }

            .option-btn:hover:not(:disabled) {
                background: #e0f2fe;
                transform: translateY(-1px);

            }

            .option-btn:disabled {

            /* Secciones */
            .section { display: none; }

            /* Tarjetas placeholder */
