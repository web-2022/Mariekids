<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Marie Kids • Escuchar y seguir instrucciones</title>
        <meta name="apple-mobile-web-app-title" content="MK" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#1976d2" />

        <style>
            * {
                box-sizing: border-box;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: linear-gradient(145deg, #dbeafe, #e0f2fe);
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: 16px;
            }

            .app {
                width: 100%;
                max-width: 760px;
                background: #fff;
                border: 3px solid #2563eb;
                border-radius: 26px;
                box-shadow: 0 18px 45px rgba(0, 0, 0, .14);
                padding: 16px;
                overflow: hidden;
            }

            .brand-header-kids {
                position: relative;
                overflow: hidden;
                padding: 10px 12px;
                border-radius: 22px;
                margin-bottom: 14px;
                background:
                    radial-gradient(circle at 12% 16%, rgba(255, 255, 255, .58) 0 0, rgba(255, 255, 255, .58) 6px, transparent 7px),
                    radial-gradient(circle at 86% 20%, rgba(255, 255, 255, .32) 0 0, rgba(255, 255, 255, .32) 8px, transparent 9px),
                    linear-gradient(135deg, #0f172a 0%, #1d4ed8 38%, #7c3aed 70%, #f97316 120%);
                border: 1px solid rgba(255, 255, 255, .88);
                box-shadow:
                    0 16px 34px rgba(37, 99, 235, .30),
                    inset 0 1px 0 rgba(255, 255, 255, .50),
                    inset 0 -18px 40px rgba(15, 23, 42, .16);
                color: #fff;
                cursor: pointer;
                user-select: none;
                isolation: isolate;
                transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
            }

            .brand-header-kids::before {
                content: "";
                position: absolute;
                inset: -55% -20%;
                background: linear-gradient(115deg,
                        transparent 0%,
                        transparent 37%,
                        rgba(255, 255, 255, .30) 46%,
                        transparent 55%,
                        transparent 100%);
                transform: translateX(-38%) rotate(8deg);
                animation: headerShine 5.5s ease-in-out infinite;
                pointer-events: none;
                z-index: 1;
            }

            .brand-header-kids::after {
                content: "";
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(90deg, rgba(255, 255, 255, .10) 1px, transparent 1px),
                    linear-gradient(0deg, rgba(255, 255, 255, .08) 1px, transparent 1px);
                background-size: 24px 24px;
                opacity: .24;
                pointer-events: none;
                z-index: 1;
            }

            .brand-header-kids:hover {
                filter: saturate(1.08) brightness(1.04);
                transform: translateY(-1px);
                box-shadow:
                    0 18px 38px rgba(37, 99, 235, .35),
                    inset 0 1px 0 rgba(255, 255, 255, .55),
                    inset 0 -18px 40px rgba(15, 23, 42, .18);
            }

            .brand-row {
                position: relative;
                z-index: 2;
                display: grid;
                grid-template-columns: 54px minmax(0, 1fr) auto;
                gap: 10px;
                align-items: center;
            }

            .kids-badge {
                width: 52px;
                height: 52px;
                border-radius: 18px;
                display: grid;
                place-items: center;
                font-size: 1.75rem;
                font-weight: 1000;
                background:
                    radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .92), rgba(255, 255, 255, .30) 42%, rgba(255, 255, 255, .08) 70%),
                    linear-gradient(135deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, .12));
                border: 1px solid rgba(255, 255, 255, .58);
                box-shadow:
                    0 10px 20px rgba(15, 23, 42, .18),
                    inset 0 1px 0 rgba(255, 255, 255, .60);
                flex: 0 0 auto;
            }

            .kids-title {
                font-weight: 1000;
                font-size: clamp(1.32rem, 4vw, 1.72rem);
                line-height: 1.02;
                letter-spacing: .2px;
                text-shadow: 0 3px 10px rgba(15, 23, 42, .32);
            }

            .brand-row>div:not(.kids-badge) .kids-title {
                white-space: nowrap;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .brand-row>.kids-title:last-child {
                justify-self: end;
                font-size: clamp(.82rem, 2.4vw, 1rem);
                line-height: 1;
                padding: 8px 10px;
                border-radius: 999px;
                background: rgba(255, 255, 255, .18);
                border: 1px solid rgba(255, 255, 255, .44);
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, .35),
                    0 8px 18px rgba(15, 23, 42, .14);
                text-shadow: 0 2px 8px rgba(15, 23, 42, .28);
                white-space: nowrap;
            }

            .kids-subtitle {
                margin-top: 5px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
                font-size: .9rem;
                font-weight: 800;
                opacity: .98;
            }

            .kids-pill,
            .ruta-pill-btn {
                background: rgba(255, 255, 255, .18);
                border: 1px solid rgba(255, 255, 255, .45);
                padding: 5px 10px;
                border-radius: 999px;
                font-size: .80rem;
                font-weight: 950;
                color: #fff;
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, .35),
                    0 7px 14px rgba(15, 23, 42, .10);
                backdrop-filter: blur(8px);
            }

            .ruta-pill-btn {
                cursor: pointer;
                font-family: inherit;
                line-height: 1.15;
                transition: transform .18s ease, background .18s ease;
            }

            .ruta-pill-btn:hover {
                background: rgba(255, 255, 255, .30);
                transform: translateY(-1px);
            }

            .bubble {
                position: absolute;
                border-radius: 999px;
                background: rgba(255, 255, 255, .16);
                border: 1px solid rgba(255, 255, 255, .26);
                pointer-events: none;
                animation: floaty 6s ease-in-out infinite;
                z-index: 0;
                filter: blur(.1px);
            }

            .b1 {
                left: -22px;
                top: -26px;
                width: 82px;
                height: 82px;
            }

            .b2 {
                right: -24px;
                bottom: -34px;
                width: 92px;
                height: 92px;
                animation-delay: 1s;
            }

            .b3 {
                left: 48%;
                bottom: -30px;
                width: 50px;
                height: 50px;
                animation-delay: .6s;
            }

            @keyframes floaty {

                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(-7px) scale(1.04);
                }
            }

            @keyframes headerShine {

                0%,
                58%,
                100% {
                    transform: translateX(-46%) rotate(8deg);
                    opacity: 0;
                }

                68% {
                    opacity: .72;
                }

                84% {
                    transform: translateX(46%) rotate(8deg);
                    opacity: 0;
                }
            }

            @media(max-width:560px) {
                .brand-header-kids {
                    padding: 9px 9px;
                    border-radius: 20px;
                }

                .brand-row {
                    grid-template-columns: 46px minmax(0, 1fr) auto;
                    gap: 8px;
                }

                .kids-badge {
                    width: 44px;
                    height: 44px;
                    border-radius: 15px;
                    font-size: 1.45rem;
                }

                .kids-title {
                    font-size: 1.18rem;
                }

                .kids-subtitle {
                    margin-top: 4px;
                }

                .ruta-pill-btn {
                    padding: 4px 8px;
                    font-size: .72rem;
                }

                .brand-row>.kids-title:last-child {
                    font-size: .74rem;
                    padding: 7px 8px;
                }
            }

            h1 {
                margin: 0;
                text-align: center;
                font-size: clamp(1.45rem, 4vw, 2rem);
                color: #111827;
            }

            .subtitle {
                text-align: center;
                font-size: .95rem;
                color: #6b7280;
                margin: 6px 0 14px;
                font-weight: 750;
            }

            .module-tabs {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px;
                border-radius: 18px;
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                margin-bottom: 14px;
            }

            .tab-btn {
                border: 1px solid #bfdbfe;
                background: #fff;
                border-radius: 999px;
                padding: 9px 12px;
                font-weight: 900;
                cursor: pointer;
                color: #111827;
            }

            .tab-btn:hover {
                transform: translateY(-1px);
                background: #dbeafe;
            }

            .tab-btn.active {
                color: #fff;
                background: linear-gradient(90deg, #60a5fa, #2563eb);
                border-color: transparent;
            }

            .status-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
                padding: 9px 12px;
                border-radius: 999px;
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                font-size: .9rem;
                flex-wrap: wrap;
            }

            .xp,
            .hearts {
                display: flex;
                align-items: center;
                gap: 4px;
                font-weight: 850;
            }

            .xp span {
                color: #16a34a;
            }

            .hearts span {
                color: #f97316;
            }

            .progress-wrapper {
                margin-bottom: 14px;
            }

            .progress-label {
                display: flex;
                justify-content: space-between;
                font-size: .82rem;
                color: #6b7280;
                margin-bottom: 5px;
                font-weight: 800;
            }

            .progress {
                width: 100%;
                height: 11px;
                background: #e5e7eb;
                border-radius: 999px;
                overflow: hidden;
            }

            .progress-inner {
                height: 100%;
                width: 0%;
                border-radius: 999px;
                background: linear-gradient(90deg, #60a5fa, #2563eb);
                transition: width .2s ease;
            }

            .module {
                display: none;
            }

            .module.active {
                display: block;
            }

            .panel {
                border-radius: 22px;
                padding: 14px;
                margin-bottom: 12px;
                border: 1px solid #e5e7eb;
                background: #f9fafb;
            }

            .panel-title {
                margin: 0 0 8px;
                color: #111827;
                font-weight: 1000;
                font-size: 1.15rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .theory {
                background: #eff6ff;
                border-color: #bfdbfe;
            }

            .examples {
                background: #f0fdf4;
                border-color: #bbf7d0;
            }

            .practice {
                background: #fff7ed;
                border-color: #fed7aa;
            }

            .theory-audio-row {
                display: flex;
                justify-content: center;
                margin: 8px 0 12px;
            }

            .no-audio-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 8px 12px;
                border-radius: 999px;
                background: #fef2f2;
                color: #991b1b;
                border: 1px solid #fecaca;
                font-weight: 950;
                margin: 6px auto 12px;
            }

            .rule {
                padding: 12px;
                border-radius: 16px;
                background: #fff;
                border: 1px solid #bfdbfe;
                color: #374151;
                font-weight: 760;
                line-height: 1.45;
                margin-bottom: 10px;
            }

            .theory-header {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin: 8px 0 12px;
            }

            @media(max-width:560px) {
                .theory-header {
                    grid-template-columns: 1fr;
                }
            }

            .rule-card {
                border-radius: 18px;
                padding: 12px;
                background: #fff;
                border: 2px solid #e5e7eb;
                font-weight: 820;
                line-height: 1.38;
            }

            .rule-card.dip {
                border-color: #86efac;
                background: linear-gradient(145deg, #ffffff, #f0fdf4);
                color: #166534;
            }

            .rule-card.hia {
                border-color: #fdba74;
                background: linear-gradient(145deg, #ffffff, #fff7ed);
                color: #9a3412;
            }

            .rule-card-title {
                font-size: 1.04rem;
                font-weight: 1000;
                margin-bottom: 6px;
            }

            .rule-card-text {
                color: #374151;
                font-weight: 820;
                line-height: 1.38;
                font-size: .95rem;
            }

            .steps {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                margin-top: 10px;
            }

            @media(max-width:560px) {
                .steps {
                    grid-template-columns: 1fr;
                }
            }

            .step {
                background: #fff;
                border: 1px solid #dbeafe;
                border-radius: 16px;
                padding: 10px;
                font-weight: 850;
                color: #374151;
            }

            .chip-row {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                margin: 12px 0;
            }

            .chip {
                background: #fff;
                border: 2px solid #dbeafe;
                color: #1e3a8a;
                border-radius: 18px;
                padding: 11px 16px;
                font-size: 1.25rem;
                font-weight: 1000;
                box-shadow: 0 8px 14px rgba(37, 99, 235, .08);
            }

            .visual-note {
                background: #fff;
                border: 1px solid #bbf7d0;
                border-radius: 16px;
                padding: 12px;
                color: #166534;
                font-weight: 850;
                line-height: 1.45;
                margin-bottom: 12px;
                text-align: center;
            }

            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                margin-top: 8px;
            }

            .legend-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 7px 10px;
                border-radius: 999px;
                font-weight: 1000;
                font-size: .86rem;
            }

            .legend-pill.green {
                background: #dcfce7;
                color: #166534;
                border: 1px solid #22c55e;
            }

            .legend-pill.orange {
                background: #ffedd5;
                color: #9a3412;
                border: 1px solid #f97316;
            }

            .visual-examples-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                margin-top: 10px;
            }

            @media(max-width:560px) {
                .visual-examples-grid {
                    grid-template-columns: 1fr;
                }
            }

            .syllable-card {
                background: #fff;
                border: 2px solid #dbeafe;
                border-radius: 20px;
                padding: 14px;
                text-align: center;
                box-shadow: 0 10px 18px rgba(37, 99, 235, .08);
            }

            .syllable-card.diptongo-card {
                border-color: #86efac;
                background: linear-gradient(145deg, #ffffff, #f0fdf4);
            }

            .syllable-card.hiato-card {
                border-color: #fdba74;
                background: linear-gradient(145deg, #ffffff, #fff7ed);
            }

            .word-main {
                font-size: 1.55rem;
                font-weight: 1000;
                color: #1e3a8a;
                margin-bottom: 6px;
            }

            .split-line {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                flex-wrap: wrap;
                margin: 8px 0;
                font-size: 1.3rem;
                font-weight: 1000;
            }

            .syllable {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 54px;
                padding: 8px 12px;
                border-radius: 15px;
                border: 2px solid #bfdbfe;
                background: #eff6ff;
                color: #1e3a8a;
                box-shadow: 0 6px 12px rgba(37, 99, 235, .08);
            }

            .syllable.join {
                border-color: #22c55e;
                background: #dcfce7;
                color: #166534;
            }

            .syllable.separate {
                border-color: #f97316;
                background: #ffedd5;
                color: #9a3412;
            }

            .hyphen {
                font-weight: 1000;
                color: #6b7280;
            }

            .vowel {
                display: inline-block;
                padding: 1px 4px;
                margin: 0 1px;
                border-radius: 8px;
                background: #fef3c7;
                color: #92400e;
                border: 1px solid #f59e0b;
            }

            .vowel.join-vowel {
                background: #bbf7d0;
                color: #166534;
                border-color: #22c55e;
            }

            .vowel.sep-vowel {
                background: #fed7aa;
                color: #9a3412;
                border-color: #f97316;
            }

            .example-tag {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 6px 10px;
                border-radius: 999px;
                font-weight: 1000;
                font-size: .86rem;
                margin-top: 6px;
            }

            .tag-diptongo {
                background: #dcfce7;
                color: #166534;
                border: 1px solid #22c55e;
            }

            .tag-hiato {
                background: #ffedd5;
                color: #9a3412;
                border: 1px solid #f97316;
            }

            .mini-explain {
                margin-top: 8px;
                color: #4b5563;
                font-weight: 800;
                line-height: 1.35;
                font-size: .94rem;
            }


            .instruction-icon {
                font-size: 2rem;
                margin-bottom: 6px;
            }

            .instruction-card {
                background: #fff;
                border: 2px solid #bfdbfe;
                border-radius: 20px;
                padding: 14px;
                text-align: center;
                box-shadow: 0 10px 18px rgba(37, 99, 235, .08);
            }

            .instruction-card.listen {
                border-color: #93c5fd;
                background: linear-gradient(145deg, #ffffff, #eff6ff);
            }

            .instruction-card.action {
                border-color: #86efac;
                background: linear-gradient(145deg, #ffffff, #f0fdf4);
            }

            .instruction-card.order {
                border-color: #fdba74;
                background: linear-gradient(145deg, #ffffff, #fff7ed);
            }

            .instruction-title {
                font-size: 1.25rem;
                font-weight: 1000;
                color: #1e3a8a;
                margin-bottom: 8px;
            }

            .instruction-box {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 8px 12px;
                border-radius: 15px;
                border: 2px solid #bfdbfe;
                background: #eff6ff;
                color: #1e3a8a;
                font-weight: 1000;
                margin: 5px;
            }

            .instruction-box.good {
                border-color: #22c55e;
                background: #dcfce7;
                color: #166534;
            }

            .instruction-box.warn {
                border-color: #f97316;
                background: #ffedd5;
                color: #9a3412;
            }

            .question-card {
                background: #fff;
                border: 1px solid #fed7aa;
                border-radius: 18px;
                padding: 12px;
            }

            .question-title {
                font-weight: 1000;
                color: #7c2d12;
                text-align: center;
                margin-bottom: 10px;
                font-size: 1.03rem;
            }

            .question-text {
                text-align: center;
                font-size: 1.13rem;
                font-weight: 1000;
                color: #111827;
                margin: 8px 0;
                line-height: 1.35;
            }

            .big-word {
                text-align: center;
                font-size: clamp(1.45rem, 5vw, 2.25rem);
                font-weight: 1000;
                color: #1e3a8a;
                margin: 8px 0 2px;
                line-height: 1.25;
            }

            .options {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 10px;
            }

            .option-btn {
                flex: 1;
                min-width: 120px;
                border-radius: 16px;
                border: 1px solid #d1d5db;
                background: #fff;
                padding: 11px 10px;
                font-size: 1.04rem;
                cursor: pointer;
                font-weight: 950;
            }

            .option-btn:hover:not(:disabled) {
                background: #e0f2fe;
                transform: translateY(-1px);
                border-color: #93c5fd;
            }

            .option-btn:disabled {
                cursor: default;
                opacity: .65;
            }

            .option-btn.correct-choice {
                background: #dcfce7;
                border-color: #22c55e;
                color: #166534;
                opacity: 1;
            }

            .option-btn.wrong-choice {
                background: #fee2e2;
                border-color: #ef4444;
                color: #991b1b;
            }

            .feedback {
                margin-top: 10px;
                text-align: center;
                min-height: 22px;
                font-weight: 900;
                line-height: 1.3;
            }

            .feedback.good {
                color: #16a34a;
            }

            .feedback.bad {
                color: #ef4444;
            }

            .controls {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 12px;
            }

            .main-btn {
                flex: 1;
                min-width: 130px;
                border: none;
                border-radius: 999px;
                padding: 11px 14px;
                color: #fff;
                font-weight: 950;
                cursor: pointer;
                background: linear-gradient(90deg, #60a5fa, #2563eb);
            }

            .main-btn.secondary {
                background: linear-gradient(90deg, #a78bfa, #7c3aed);
            }

            .summary-box {
                padding: 12px;
                border-radius: 18px;
                background: #ecfeff;
                border: 2px solid #67e8f9;
                color: #155e75;
                font-weight: 850;
                line-height: 1.45;
            }

            @media(max-width:560px) {
                body {
                    padding: 12px;
                }

                .app {
                    padding: 13px;
                }
            }
        </style>
    </head>

    <body>
        <div class="app">
            <div class="brand-header-kids" aria-label="Marie Kids" role="link" tabindex="0" onclick="goHome()"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goHome();}">
                <div class="bubble b1"></div>
                <div class="bubble b2"></div>
                <div class="bubble b3"></div>

                <div class="brand-row">
                    <div class="kids-badge" aria-hidden="true">🌈</div>
                    <div>
                        <div class="kids-title">Marie Kids</div>

                target.innerHTML = `
                    <div class="question-title">Ejercicio ${idx + 1} de ${data.questions.length}</div>
                    <div class="question-text">${q.prompt}</div>
                    <div class="big-word">${q.word || ""}</div>
                    <div class="options">
                        ${opts.map(o => `<button class="option-btn" onclick="checkAnswer('${moduleName}','${escapeAttr(o)}',this)">${o}</button>`).join("")}
                    </div>
                    <div class="feedback" id="feedback-${moduleName}"></div>
                    <div class="controls">${controls}</div>`;
            }

            function escapeAttr(s) {
                return String(s).replace(/'/g, "&#39;");
            }

            function checkAnswer(moduleName, answer, btn) {
                answer = answer.replace(/&#39;/g, "'");
                const q = modules[moduleName].questions[state.index[moduleName]];
                const fb = document.getElementById("feedback-" + moduleName);

                if (!q || state.answered[moduleName].has(state.index[moduleName])) return;

                if (answer === q.answer) {
                    state.answered[moduleName].add(state.index[moduleName]);
                    state.correct++;
                    btn.classList.add("correct-choice");
                    fb.textContent = "✅ Muy bien. " + q.explain;
                    fb.className = "feedback good";
                    disableOptions(moduleName, q.answer);
                    updateProgress();
                } else {
                    state.wrong++;
                    btn.classList.add("wrong-choice");
                    btn.disabled = true;
                    fb.textContent = "❌ Aún no. Lee con calma la instrucción e intenta otra vez.";
                    fb.className = "feedback bad";
                    updateProgress();
                }
            }

            function disableOptions(moduleName, correct) {
                document.getElementById("practice-" + moduleName).querySelectorAll(".option-btn").forEach(b => {
                    b.disabled = true;
                    if (b.textContent === correct) b.classList.add("correct-choice");
                });
            }

            function nextQuestion(moduleName) {
                if (!state.answered[moduleName].has(state.index[moduleName])) {
                    const fb = document.getElementById("feedback-" + moduleName);
                    if (fb) {
                        fb.textContent = "👉 Primero responde correctamente para avanzar.";
                        fb.className = "feedback bad";
                    }
                    return;
                }
                state.index[moduleName]++;
                renderPractice(moduleName);
            }

            function restartModule(moduleName) {
                state.index[moduleName] = 0;
                state.answered[moduleName] = new Set();
                renderPractice(moduleName);
                updateProgress();
            }

            function goNextModule(moduleName) {
                showModule(order[order.indexOf(moduleName) + 1] || "olimpiadas");
            }

            function updateProgress() {
                document.getElementById("correctCount").textContent = state.correct;
                document.getElementById("wrongCount").textContent = state.wrong;

                const done = Object.values(state.answered).reduce((s, set) => s + set.size, 0);
                document.getElementById("progressText").textContent = `${done}/${state.totalQuestions}`;
                document.getElementById("progressBar").style.width = (done / state.totalQuestions * 100) + "%";
            }

            function shuffleArray(a) {
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
            }

            function shareApp() {
                const data = {
                    title: "Marie Kids - Escuchar y seguir instrucciones",
                    text: "📚 Practica cómo escuchar y seguir instrucciones.",
                    url: window.location.href
                };

                if (navigator.share) {
                    navigator.share(data).catch(() => { });
                } else {
                    navigator.clipboard.writeText(data.url);
                    alert("🔗 Link copiado para compartir");
                }
            }

            buildPage();
            renderExampleButtons();
            order.forEach(renderPractice);
            updateProgress();
        </script>

        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("./service-worker.js").catch(() => { });
                });
            }
        </script>
    </body>

</html>
