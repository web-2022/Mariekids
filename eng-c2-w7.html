                font-size: .82rem;
                font-weight: 850;
            }

            /* ⭐ estrellas (si las quieres) */
            .star {
                position: absolute;
                z-index: 1;
                opacity: .9;
                filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .12));
                animation: twinkle 2.8s ease-in-out infinite;
                pointer-events: none;
            }

            .star.s1 {
                top: 8px;
                right: 18px;
                font-size: 1.15rem;
                animation-delay: 0s;
            }

            .star.s2 {
                top: 40px;
                right: 60px;
                font-size: .95rem;
                animation-delay: .6s;
            }

            .star.s3 {
                bottom: 12px;
                right: 26px;
                font-size: 1.25rem;
                animation-delay: 1.1s;
            }

            /* Estilo base de burbuja + animación*/
            .bubble {
                position: absolute;
                z-index: 0;
                border-radius: 999px;
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .28);
                box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45);
                pointer-events: none;

                /* mejor compatibilidad */
                -webkit-backdrop-filter: blur(2px);
                backdrop-filter: blur(2px);

                animation: floaty 6s ease-in-out infinite;
            }

            /* Posición de cada burbuja*/
            .b1 {
                left: -16px;
                top: -18px;
                animation-delay: 0s;
                transform: rotate(5deg);
                width: 84px;
                height: 84px;
            }

            .b2 {
                left: 40px;
                bottom: -22px;
                width: 52px;
                height: 52px;
                animation-delay: .8s;
            }

            .b3 {
                right: -22px;
                bottom: -26px;
                width: 76px;
                height: 76px;
                animation-delay: 1.3s;
            }

            /* Movimiento flotante*/
            @keyframes floaty {
                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(-8px) scale(1.03);
                }
