<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>MK Dinosaurios por tamaño · 3 años</title>
    <meta name="theme-color" content="#0b73ff" />
    <meta name="apple-mobile-web-app-title" content="MK" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/mk-juegos.css" />
    <link rel="stylesheet" href="../../assets/mk-peques.css?v=4" />
    <style>
        body { background: #f7fee7; }
        .fila { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin-top: 8px; min-height: 120px; padding: 10px 6px; border-radius: 20px; background: #ecfccb; }
        .hueco { width: 64px; height: 110px; border: 4px dashed #a3a3a3; border-radius: 14px; display: flex; align-items: flex-end; justify-content: center; }
        .hueco.lleno { border-color: transparent; }
        .flecha { margin: 6px 0 0; font: 800 18px "Nunito", sans-serif; color: #4d7c0f; }
        .pasto { display: flex; justify-content: center; align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-top: 16px; min-height: 120px; padding: 10px; border-radius: 20px; background: #fef3c7; }
        .dino { line-height: 1; cursor: grab; user-select: none; }
        .dino.mal { animation: sacude .4s; }
        @keyframes sacude { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
        @media (max-width: 480px) { .hueco { width: 54px; } }
        .torre { display: flex; flex-direction: column-reverse; gap: 2px; align-items: center; }
        .torre i { width: 30px; height: 14px; border-radius: 3px; background: linear-gradient(180deg, #fb923c, #ea580c); }
        .numc { min-width: 50px; font-size: 26px !important; padding: 8px 6px; border-radius: 14px; background: #fde68a; font: 800 32px "Baloo 2", sans-serif; color: #92400e; text-align: center; }

    </style>
</head>
<body>
    <!-- GENERADO por tools/juegos3/build.py — edita tools/juegos3/dinos.css / dinos.js -->
    <div class="bar">
        <a class="pill" href="../juegos3Y.html" aria-label="Volver a los juegos">⬅<span class="txt"> Juegos</span></a>
        <h1>🦖 Dinosaurios por tamaño</h1>
        <button class="pill" id="soundBtn" type="button" aria-label="Sonido">🔊</button>
    </div>
    <div class="hud" aria-live="polite"><span id="hudLevel">Nivel 1</span><span id="hudQ"></span><span id="hudOk">⭐ 0</span></div>
    <main class="stage"><div class="card" id="card"></div></main>
    <div class="overlay show" id="startScreen">
        <div class="panel">
            <h2>🦖 Dinosaurios por tamaño</h2>
            <p>Ordena los dinosaurios de pequeño a grande.</p>
            <div class="levels" id="levels"></div>
        </div>
    </div>
    <div class="overlay" id="endScreen">
        <div class="panel">
            <h2>¡Muy bien! 🎉</h2>
            <div class="stars-big" id="endStars">⭐⭐⭐</div>
            <p id="endText"></p>
            <div class="row">
                <button class="big-btn alt" id="menuBtn" type="button">📋 Niveles</button>
                <button class="big-btn" id="nextBtn" type="button">▶ Siguiente</button>
            </div>
        </div>
    </div>
    <script src="../../assets/mk-juegos.js?v=2"></script>
    <script src="../../assets/mk-peques.js?v=4"></script>
    <script>
        /* 🦖 DINOSAURIOS POR TAMAÑO: seriación. Ordena de pequeño a grande (o al revés). */
        const R = MKJ.rnd;
        const TAM = [22, 32, 44, 56, 70];
        let orden = [], puestos = 0, primera = true, listoFn = null, alReves = false;
        MKP.juego({
            clave: "dinos3a", rondas: 5, icono: "🦖",
            niveles: [
                { n: 1, name: "Nivel 1", desc: "3 dinos: de pequeño a grande", cls: "lv1", k: 3, reves: false },
                { n: 2, name: "Nivel 2", desc: "4 dinos: de pequeño a grande", cls: "lv2", k: 4, reves: false },
                { n: 3, name: "Nivel 3", desc: "5 dinos: también de grande a pequeño", cls: "lv3", k: 5, reves: true }
            ],
            niveles6: [
                { n: 1, name: "Nivel 1", desc: "Números hasta 100", cls: "lv1", k: 5, reves: true, tipo: "num", max: 100 },
                { n: 2, name: "Nivel 2", desc: "Números hasta 999", cls: "lv2", k: 5, reves: true, tipo: "num", max: 999 },
                { n: 3, name: "Nivel 3", desc: "Números parecidos", cls: "lv3", k: 5, reves: true, tipo: "num", max: 99, cerca: true }
            ],
            niveles5: [
                { n: 1, name: "Nivel 1", desc: "Números hasta 50", cls: "lv1", k: 5, reves: true, tipo: "num", max: 50 },
                { n: 2, name: "Nivel 2", desc: "Números hasta 100", cls: "lv2", k: 5, reves: true, tipo: "num", max: 100 },
                { n: 3, name: "Nivel 3", desc: "Números parecidos: 41, 14, 44…", cls: "lv3", k: 5, reves: true, tipo: "num", max: 99, cerca: true }
            ],
            niveles4: [
                { n: 1, name: "Nivel 1", desc: "5 dinos: pequeño ↔ grande", cls: "lv1", k: 5, reves: true },
                { n: 2, name: "Nivel 2", desc: "Torres: de menos a más bloques", cls: "lv2", k: 4, reves: true, tipo: "torre" },
                { n: 3, name: "Nivel 3", desc: "Números: de menor a mayor (hasta 20)", cls: "lv3", k: 5, reves: true, tipo: "num" }
            ],
            ronda(nv, i, listo) {
                primera = true; listoFn = listo; puestos = 0; alReves = nv.reves && i % 2 === 1;
                let tams = nv.k === 5 ? TAM : nv.k === 4 ? [22, 36, 52, 70] : [24, 44, 70];
                if (nv.tipo === "torre") tams = MKJ.shuffle([1, 2, 3, 4, 5, 6, 7]).slice(0, nv.k).sort((a, b) => a - b);
                if (nv.tipo === "num") {
                    if (nv.cerca) { const d1 = R(1, 8), d2 = R(1, 9); tams = [...new Set([d1 * 10 + d2, d2 * 10 + d1, d1 * 10 + d1, d1 * 10, d2 * 10 + d2, (d1 + 1) * 10 + d2, d1 * 10 + d2 + 1])].filter(x => x > 0 && x < 100).slice(0, nv.k).sort((a, b) => a - b); }
                    else tams = MKJ.shuffle([...Array(nv.max || 20).keys()].map(x => x + 1)).slice(0, nv.k).sort((a, b) => a - b);
                }
                orden = alReves ? tams.slice().reverse() : tams.slice();
                const e = MKJ.pick(["🦕", "🦖"]);
                document.getElementById("card").innerHTML = `<p class="task">${nv.tipo === "num" ? `Ordena de <span class="big">${alReves ? "mayor" : "menor"}</span> a ${alReves ? "menor" : "mayor"}` : nv.tipo === "torre" ? `Ordena de <span class="big">${alReves ? "más" : "menos"}</span> a ${alReves ? "menos" : "más"} bloques` : `Ordena de <span class="big">${alReves ? "grande" : "pequeño"}</span> a ${alReves ? "pequeño" : "grande"}`} <button class="again" id="oir" type="button">🔊</button></p>
                    <div class="fila">${orden.map((t, k) => `<div class="hueco" data-drop="hueco" data-k="${k}"></div>`).join("")}</div>
                    <p class="flecha">${nv.tipo ? (alReves ? "MÁS ➡️ menos" : "menos ➡️ MÁS") : alReves ? "GRANDE ➡️ pequeño" : "pequeño ➡️ GRANDE"}</p>
                    <div class="pasto" id="pasto">${MKJ.shuffle(tams.slice()).map(t => nv.tipo === "torre" ? `<span class="dino torre" data-t="${t}">${"<i></i>".repeat(t)}</span>` : nv.tipo === "num" ? `<span class="dino numc" data-t="${t}">${t}</span>` : `<span class="dino" data-t="${t}" style="font-size:${t + 18}px">${e}</span>`).join("")}</div>`;
                document.querySelectorAll(".dino").forEach(d => MKP.arrastrar(d, { alSoltar: h => poner(d, h) }));
                const txt = nv.tipo === "num" ? (alReves ? "Ordena los números de mayor a menor" : "Ordena los números de menor a mayor") : nv.tipo === "torre" ? (alReves ? "Ordena las torres de más a menos bloques" : "Ordena las torres de menos a más bloques") : alReves ? "Ordena los dinosaurios de grande a pequeño" : "Ordena los dinosaurios de pequeño a grande";
                document.getElementById("oir").onclick = () => MKP.decir(txt); MKP.decir(txt);
            }
        });
        function poner(d, h) {
            if (h.classList.contains("lleno")) return false;
            if (orden[+h.dataset.k] !== +d.dataset.t) {
                primera = false; MKJ.sound("error"); d.classList.remove("mal"); void d.offsetWidth; d.classList.add("mal");
                MKP.decir(+h.dataset.k === 0 ? (alReves ? "Primero va el más grande" : "Primero va el más pequeño") : "Ese no va ahí"); return false;
            }
            h.classList.add("lleno"); d.dataset.bloqueado = 1; d.style.opacity = ""; h.appendChild(d); puestos++; MKJ.sound("moneda");
            if (puestos === orden.length) { MKJ.sound("ok"); MKP.aviso("¡Rooar!", true); MKP.decir("¡Muy bien! Están en orden"); listoFn(primera); }
            return true;
        }
        window.__juego = { get orden() { return orden; } };

    </script>
</body>
</html>
