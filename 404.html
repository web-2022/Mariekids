<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b73ff" />
    <title>MVG Learning | Muy pronto</title>
    <!-- GitHub Pages muestra esta página cuando un enlace todavía no existe -->
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            font-family: "Nunito", "Baloo 2", Arial, sans-serif;
            color: #17365d;
            background: linear-gradient(180deg, #c9efff 0%, #eefaff 50%, #e2f6df 100%);
        }

        .box {
            width: min(100%, 460px);
            padding: 28px 22px;
            text-align: center;
            border: 4px solid #fff;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 0 rgba(44, 91, 145, 0.12), 0 20px 40px rgba(42, 77, 119, 0.12);
        }

        .rainbow {
            height: 8px;
            margin: -28px -22px 20px;
            border-radius: 26px 26px 0 0;
            background: linear-gradient(90deg, #58cc02, #ffc800, #ff9600, #ff6aa9, #8b5cf6, #0f9dff);
        }

        .emoji {
            font-size: 76px;
            line-height: 1;
            animation: hop 2s ease-in-out infinite;
        }

        @keyframes hop {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        h1 {
            margin: 12px 0 6px;
            font-size: 32px;
            line-height: 1.05;
        }

        p {
            margin: 0 0 20px;
            color: #6f8098;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.4;
        }

        .buttons {
            display: grid;
            gap: 12px;
        }

        .btn {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 18px;
            color: #fff;
            font-family: inherit;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            text-decoration: none;
            cursor: pointer;
        }

        .back { background: linear-gradient(180deg, #69d900, #4eb700); box-shadow: 0 6px 0 #378f00; }
        .home { background: linear-gradient(180deg, #17aaff, #087fe9); box-shadow: 0 6px 0 #0864b5; }

        @media (prefers-reduced-motion: reduce) { .emoji { animation: none; } }
    </style>
</head>

<body>
    <main class="box">
        <div class="rainbow" aria-hidden="true"></div>
        <div class="emoji" aria-hidden="true">🚧🐰</div>
        <h1>¡Este tema llega muy pronto!</h1>
        <p>Todavía lo estamos preparando. Mientras tanto, puedes seguir aprendiendo con otras aventuras.</p>
        <div class="buttons">
            <button class="btn back" id="backBtn" type="button">⬅ Volver</button>
            <a class="btn home" id="homeBtn" href="/">🏠 Ir al inicio</a>
        </div>
    </main>

    <script>
        // Inicio del sitio: en GitHub Pages el proyecto vive en /Mariekids/
        const firstSegment = location.pathname.split("/").filter(Boolean)[0];
        const isProjectSite = location.hostname.endsWith("github.io") && firstSegment;
        document.getElementById("homeBtn").href = isProjectSite ? `/${firstSegment}/` : "/";

        document.getElementById("backBtn").addEventListener("click", () => {
            if (history.length > 1) history.back();
            else location.href = document.getElementById("homeBtn").href;
        });
    </script>
</body>

</html>
