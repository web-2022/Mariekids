@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.04)}}

<h1>Examen final de Comunicación</h1>
<p class="subtitle">20 preguntas aleatorias de los 35 temas. Tienes 30 minutos.</p>

<script>
function goHome(){location.href="index.html";}
function goRuta(){location.href="ruta-comunicaciones.html";}

const QUESTION_BANK = [{"id": 1, "tema": "Escuchar y seguir instrucciones", "prompt": "La profesora dice: primero escribe tu nombre y luego colorea el dibujo. ¿Qué haces primero?", "word": "Instrucción", "answer": "escribir tu nombre", "options": ["colorear", "escribir tu nombre", "guardar el lápiz", "borrar", "cerrar el cuaderno"], "explain": "Primero debes escribir tu nombre."}, {"id": 2, "tema": "Vocales y sonidos iniciales", "prompt": "Marca la palabra que empieza con la vocal a.", "word": "Opciones", "answer": "avión", "options": ["mesa", "oso", "avión", "uva", "sol"], "explain": "Avión empieza con la vocal a."}, {"id": 3, "tema": "Sílabas directas", "prompt": "Marca la palabra que se forma con las sílabas ma + no.", "word": "ma + no", "answer": "mano", "options": ["mono", "mano", "mina", "nube", "moto"], "explain": "Ma + no forma mano."}, {"id": 4, "tema": "Formación de palabras", "prompt": "Ordena las sílabas para formar una palabra con sentido.", "word": "sa - ca", "answer": "casa", "options": ["saca", "casa", "seca", "cosa", "saco"], "explain": "Ca + sa forma casa."}, {"id": 5, "tema": "Lectura de palabras", "prompt": "Marca la palabra que corresponde al dibujo imaginario de una fruta amarilla y larga.", "word": "🍌", "answer": "plátano", "options": ["manzana", "uva", "plátano", "pera", "fresa"], "explain": "El plátano es una fruta amarilla y larga."}, {"id": 6, "tema": "Separación en sílabas", "prompt": "Marca la separación correcta.", "word": "pelota", "answer": "pe-lo-ta", "options": ["pe-lo-ta", "pel-ota", "pelo-ta", "pe-lot-a", "pel-o-ta"], "explain": "Pelota se separa pe-lo-ta."}, {"id": 7, "tema": "Diptongo e hiato", "prompt": "Marca la palabra con hiato.", "word": "Opciones", "answer": "río", "options": ["cielo", "auto", "peine", "río", "cuento"], "explain": "Río tiene hiato: rí-o."}, {"id": 8, "tema": "Acento: fuerza de voz", "prompt": "¿En qué sílaba suena más fuerte la palabra ca-sa?", "word": "casa", "answer": "ca", "options": ["ca", "sa", "las dos", "ninguna", "a"], "explain": "En casa, la fuerza de voz cae en ca."}, {"id": 9, "tema": "Sílaba tónica y átonas", "prompt": "Marca la sílaba tónica.", "word": "ma-má", "answer": "má", "options": ["ma", "má", "m", "a", "ninguna"], "explain": "En mamá, la sílaba tónica es má."}, {"id": 10, "tema": "Uso de la tilde", "prompt": "Marca la palabra correctamente escrita.", "word": "Opciones", "answer": "Raúl", "options": ["Raul", "raul", "Raúl", "RAul", "Rául"], "explain": "Raúl lleva tilde en la ú."}, {"id": 11, "tema": "Lectura de oraciones cortas", "prompt": "Lee y responde: El gato duerme en la silla. ¿Quién duerme?", "word": "El gato duerme en la silla.", "answer": "el gato", "options": ["la silla", "el gato", "el perro", "la mesa", "la niña"], "explain": "El texto dice que duerme el gato."}, {"id": 12, "tema": "Mayúscula inicial y punto final", "prompt": "Marca la oración bien escrita.", "word": "Opciones", "answer": "María juega en el patio.", "options": ["maría juega en el patio.", "María juega en el patio", "María juega en el patio.", "maría juega en el patio", "MARÍA juega"], "explain": "La oración inicia con mayúscula y termina con punto."}, {"id": 13, "tema": "Escritura de palabras y oraciones", "prompt": "Elige la oración que tiene sentido.", "word": "Opciones", "answer": "El perro toma agua.", "options": ["La mesa come sopa.", "El perro toma agua.", "El lápiz duerme.", "La silla canta.", "El sol lee."], "explain": "El perro sí puede tomar agua."}, {"id": 14, "tema": "Ordenar palabras para formar oraciones", "prompt": "Ordena las palabras.", "word": "lee / Ana / un cuento", "answer": "Ana lee un cuento.", "options": ["Lee Ana cuento un.", "Ana lee un cuento.", "Un Ana cuento lee.", "Cuento lee Ana un.", "Ana cuento lee."], "explain": "La oración correcta es Ana lee un cuento."}, {"id": 15, "tema": "Completar oraciones", "prompt": "Completa la oración.", "word": "El niño ___ una pelota.", "answer": "patea", "options": ["duerme", "patea", "lee", "canta", "bebe"], "explain": "El niño patea una pelota tiene sentido."}, {"id": 16, "tema": "El artículo", "prompt": "Completa con el artículo correcto.", "word": "___ flores son rojas.", "answer": "Las", "options": ["El", "La", "Los", "Las", "Un"], "explain": "Flores es femenino plural: Las flores."}, {"id": 17, "tema": "El sustantivo", "prompt": "Marca el sustantivo.", "word": "El conejo salta rápido.", "answer": "conejo", "options": ["El", "conejo", "salta", "rápido", "muy"], "explain": "Conejo nombra un animal."}, {"id": 18, "tema": "El adjetivo", "prompt": "Marca el adjetivo.", "word": "La casa pequeña.", "answer": "pequeña", "options": ["La", "casa", "pequeña", "vive", "una"], "explain": "Pequeña dice cómo es la casa."}, {"id": 19, "tema": "El verbo", "prompt": "Marca el verbo.", "word": "Rosa canta bonito.", "answer": "canta", "options": ["Rosa", "canta", "bonito", "la", "flor"], "explain": "Canta es una acción."}, {"id": 20, "tema": "Sujeto y predicado", "prompt": "Marca el sujeto.", "word": "El ave vuela alto.", "answer": "El ave", "options": ["El ave", "vuela alto", "alto", "vuela", "ave alto"], "explain": "El sujeto es de quién se habla."}, {"id": 21, "tema": "Comprensión literal", "prompt": "Lee y responde: Carla tiene una mochila azul. ¿De qué color es la mochila?", "word": "Carla tiene una mochila azul.", "answer": "azul", "options": ["roja", "verde", "azul", "negra", "amarilla"], "explain": "El texto dice que la mochila es azul."}, {"id": 22, "tema": "Personajes, lugares y acciones", "prompt": "Lee: Pedro juega en el parque. ¿Dónde ocurre la acción?", "word": "Pedro juega en el parque.", "answer": "en el parque", "options": ["en la casa", "en el parque", "en la cocina", "en el aula", "en la sala"], "explain": "El lugar es el parque."}, {"id": 23, "tema": "Secuencia de hechos", "prompt": "Marca el orden correcto.", "word": "Primero me lavo las manos. Luego como.", "answer": "lavarse las manos y comer", "options": ["comer y lavarse", "lavarse las manos y comer", "d  "bajo", "options": ["grande", "bajo", "largo", "fuerte", "nuevo"], "explain": "Alto es contrario de bajo."}, {"id": 31, "tema": "Palabra intrusa", "prompt": "Marca la palabra intrusa.", "word": "rojo, azul, verde, mesa", "answer": "mesa", "options": ["rojo", "azul", "verde", "mesa", "amarillo"], "explain": "Mesa no es un color."}, {"id": 32, "tema": "Término excluido", "prompt": "Marca el término excluido.", "word": "lápiz, cuaderno, borrador, cama", "answer": "cama", "options": ["lápiz", "cuaderno", "borrador", "cama", "regla"], "explain": "Cama no es útil escolar."}, {"id": 33, "tema": "Analogías y completar oraciones", "prompt": "Completa la analogía.", "word": "zapato : pie :: guante : ___", "answer": "mano", "options": ["cabeza", "mano", "rodilla", "oreja", "nariz"], "explain": "El zapato va en el pie y el guante en la mano."}, {"id": 34, "tema": "Vocabulario en contexto", "prompt": "Según la oración, ¿qué significa repleta?", "word": "La mochila estaba repleta de libros.", "answer": "llena", "options": ["vacía", "llena", "rota", "nueva", "liviana"], "explain": "Repleta significa llena."}, {"id": 35, "tema": "Lectura de imágenes y oraciones", "prompt": "Imagina una imagen de una niña leyendo. Marca la oración correcta.", "word": "👧📖", "answer": "La niña lee un libro.", "options": ["La niña come sopa.", "La niña lee un libro.", "El perro duerme.", "La niña corre en el parque.", "El niño pinta una mesa."], "explain": "La imagen representa a una niña leyendo."}];
const EXAM_SIZE = 20;
const EXAM_MINUTES = 30;

let examQuestions = [];
let answers = {};
let finished = false;
let timeLeft = EXAM_MINUTES * 60;
let timerId = null;

function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function letter(i){ return String.fromCharCode(65+i); }

function generateNewExam(){
  if(!finished && Object.keys(answers).length > 0){
    if(!confirm("¿Quieres generar otro examen? Se perderán tus respuestas actuales.")) return;
  }
  finished = false;
  answers = {};
  examQuestions = shuffleArray([...QUESTION_BANK]).slice(0, EXAM_SIZE).map(q => ({
    ...q,
    options: shuffleArray([...q.options])
  }));
  timeLeft = EXAM_MINUTES * 60;
  document.getElementById("results").style.display = "none";
  renderExam();
  updateProgress();
  startTimer();
}

function startTimer(){
  if(timerId) clearInterval(timerId);
  updateTimer();
  timerId = setInterval(() => {
    if(finished) return;
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timerId);
      finishExam(true);
    }
  }, 1000);
}

function updateTimer(){
  const min = Math.floor(timeLeft / 60);
  const sec = timeLeft % 60;
  document.getElementById("timer").textContent = `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function renderExam(){
  const panel = document.getElementById("examPanel");
  panel.innerHTML = examQuestions.map((q, idx) => {
    const selected = answers[q.id];
    return `
      <div class="question-card" id="q-${q.id}">
        <div class="question-head">
          <div class="question-title">Pregunta ${idx + 1} de ${EXAM_SIZE}</div>
          <div class="topic-tag">${q.tema}</div>
        </div>
        <div class="question-text">${q.prompt}</div>
        <div class="big-word">${q.word || ""}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option-btn ${selected === opt ? "selected" : ""}" onclick="selectAnswer(${q.id}, '${escapeAttr(opt)}', this)" ${finished ? "disabled" : ""}>
              <b>${letter(i)})</b> ${opt}
            </button>
          `).join("")}
        </div>
      </div>`;
  }).join("");
}

function escapeAttr(s){
  return String(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}

function selectAnswer(id, ans, btn){
  if(finished) return;
  ans = ans.replace(/&#39;/g,"'").replace(/&quot;/g,'"');
  answers[id] = ans;

  const card = document.getElementById("q-" + id);
  card.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  updateProgress();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  document.getElementById("progressText").textContent = `${done}/${EXAM_SIZE}`;
  document.getElementById("progressBar").style.width = (done / EXAM_SIZE * 100) + "%";
}

function finishExam(auto=false){
  if(finished) return;
  if(!auto && Object.keys(answers).length < EXAM_SIZE){
    if(!confirm("Aún faltan preguntas. ¿Deseas finalizar de todos modos?")) return;
  }
  finished = true;
  if(timerId) clearInterval(timerId);

  let correct = 0;
  let wrong = 0;
  let blank = 0;

  examQuestions.forEach(q => {
    if(!answers[q.id]){
      blank++;
    } else if(answers[q.id] === q.answer){
      correct++;
    } else {
      wrong++;
    }
  });

  const pointsCorrect = correct * 10;
  const pointsWrong = wrong * -2;
  const pointsBlank = blank * 0;
  const totalPoints = pointsCorrect + pointsWrong + pointsBlank;

  // Nota del 1 al 20:
  // 20 correctas = 200 puntos = nota 20.
  // La nota se limita entre 1 y 20.
  const rawGrade = totalPoints / 10;
  const grade = Math.max(1, Math.min(20, rawGrade));
  const gradeText = Number.isInteger(grade) ? String(grade) : grade.toFixed(1);

  let performanceTitle = "";
  let performanceMsg = "";
  let performanceIcon = "";
  let performanceClass = "";

  if(grade >= 18){
    performanceIcon = "🌟";
    performanceTitle = "¡Felicitaciones!";
    performanceMsg = "Rendimiento excelente. Dominas muy bien los temas de Comunicación.";
    performanceClass = "excellent";
  } else if(grade >= 14){
    performanceIcon = "👏";
    performanceTitle = "¡Bien hecho!";
    performanceMsg = "Rendimiento bueno. Sigue practicando para llegar al nivel excelente.";
    performanceClass = "good";
  } else if(grade >= 11){
    performanceIcon = "💪";
    performanceTitle = "Vas por buen camino";
    performanceMsg = "Rendimiento regular. Repasa los temas donde tuviste errores.";
    performanceClass = "regular";
  } else {
    performanceIcon = "📚";
    performanceTitle = "Estudia más";
    performanceMsg = "Necesitas repasar con calma y volver a intentarlo.";
    performanceClass = "study";
  }

  const recommendedTopics = [...new Set(
    examQuestions
      .filter(q => !answers[q.id] || answers[q.id] !== q.answer)
      .map(q => q.tema)
  )];

  renderExam();

  examQuestions.forEach(q => {
    const card = document.getElementById("q-" + q.id);
    card.querySelectorAll(".option-btn").forEach(btn => {
      const txt = btn.textContent.replace(/^[A-E]\)\s*/,"").trim();
      if(txt === q.answer) btn.classList.add("correct-choice");
      if(answers[q.id] && txt === answers[q.id] && answers[q.id] !== q.answer) btn.classList.add("wrong-choice");
      btn.disabled = true;
    });
  });

  const results = document.getElementById("results");
  results.style.display = "block";
  results.innerHTML = `
    <h2>${auto ? "⏱️ Tiempo terminado" : "🏁 Examen finalizado"}</h2>

    <div class="score-grid">
      <div class="score-card grade-card">
        <div class="score-label">Nota</div>
        <div class="score-value">${gradeText}<span>/20</span></div>
      </div>

      <div class="score-card">
        <div class="score-label">Puntaje</div>
        <div class="score-value">${totalPoints}<span> puntos</span></div>
      </div>
    </div>

    <div class="performance-box ${performanceClass}">
      <div class="performance-icon">${performanceIcon}</div>
      <div>
        <div class="performance-title">${performanceTitle}</div>
        <div class="performance-msg">${performanceMsg}</div>
      </div>
    </div>

    <div class="score-detail">
      <b>Detalle del puntaje:</b><br>
      ✅ Correctas: ${correct} × 10 = ${pointsCorrect} puntos<br>
      ❌ Incorrectas: ${wrong} × -2 = ${pointsWrong} puntos<br>
      ⚪ No marcadas: ${blank} × 0 = ${pointsBlank} puntos
    </div>

    <div class="recommendation-box">
      <div class="recommendation-title">📌 Recomendación</div>
      <div class="recommendation-text">
        ${recommendedTopics.length
          ? `Estudia los siguientes temas: <b>${recommendedTopics.join(" · ")}</b>.`
          : "Excelente. No necesitas repasar temas específicos de este examen."}
      </div>
    </div>

    <div class="review-item">
      <b>Temas evaluados en este examen:</b><br>
      ${examQuestions.map(q => q.tema).join(" · ")}
    </div>

    <h2 style="margin-top:12px;">Revisión</h2>
    ${examQuestions.map((q, idx) => `
      <div class="review-item">
        <b>${idx+1}. ${q.tema}</b><br>
        Tu respuesta:
        <span class="${answers[q.id] === q.answer ? "review-good" : "review-bad"}">
          ${answers[q.id] || "Sin responder"}
        </span><br>
        Respuesta correcta: <span class="review-good">${q.answer}</span><br>
        ${q.explain}
      </div>
    `).join("")}
  `;

  results.scrollIntoView({behavior:"smooth", block:"start"});
}

function shareApp(){
  const data = {
    title:"Marie Kids - Examen final de Comunicación",
    text:"🏅 Practica un examen final de Comunicación con cronómetro.",
    url:window.location.href
  };
  if(navigator.share) navigator.share(data).catch(()=>{});
  else {
    navigator.clipboard.writeText(data.url);
    alert("🔗 Link copiado para compartir");
  }
}

generateNewExam();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  });
}
</script>
