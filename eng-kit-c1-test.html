            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(145deg, #dbeafe, #e0f2fe);
                padding: 18px;
            }

            .app {
                background: #ffffff;
                width: 100%;
                max-width: 520px;
                padding: 18px;
                border-radius: 24px;
                box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
                border: 3px solid #2563eb;
            }

            /* 🌟 Encabezado infantil */
            /* Contenedor*/
            .brand-header-kids {
                position: relative;
                overflow: hidden;
                padding: 14px 14px 12px;
                border-radius: 22px;
                margin-bottom: 12px;
                background: linear-gradient(135deg, #93c5fd, #60a5fa, #2563eb);
                border: 2px solid rgba(255, 255, 255, .65);
                box-shadow: 0 14px 28px rgba(37, 99, 235, .25);
                color: #fff;
            }

            /* ✅ Clickable (ir a index.html) */
            .brand-header-kids.clickable {
                cursor: pointer;
                user-select: none;
                transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            }

            .brand-header-kids.clickable:hover {
                transform: translateY(-1px);
                filter: brightness(1.02);
                box-shadow: 0 18px 34px rgba(37, 99, 235, .28);
            }

            .brand-header-kids.clickable:active {
                transform: translateY(0px) scale(0.995);
            }

            /* Para que el click funcione aunque toques estrellas/burbujas */
            .brand-header-kids .bubble,
            .brand-header-kids .star {
                pointer-events: none;
            }

            .brand-row {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .kids-badge {
                width: 52px;
                height: 52px;
                border-radius: 18px;
                display: grid;
                place-items: center;
                font-size: 1.55rem;
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .35);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
            }

            .kids-title {
                font-weight: 950;
                font-size: 1.55rem;
                letter-spacing: .02em;
                line-height: 1.05;
                text-shadow: 0 2px 0 rgba(0, 0, 0, .12);
            }

            .kids-subtitle {
                margin-top: 4px;
                font-size: .9rem;
                font-weight: 750;
                opacity: .95;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .kids-pill {
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .35);
                padding: 4px 10px;
                border-radius: 999px;
                font-size: .82rem;
                font-weight: 850;
            }

            /* ⭐ estrellas (si las quieres) */
            .star {
                position: absolute;
                z-index: 1;
                opacity: .9;
                filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .12));
                animation: twinkle 2.8s ease-in-out infinite;
                pointer-events: none;
            }

            .star.s1 {
                top: 8px;
                right: 18px;
                font-size: 1.15rem;
                animation-delay: 0s;
            }

            .star.s2 {
                top: 40px;
                right: 60px;
                font-size: .95rem;
                animation-delay: .6s;
            }

            .star.s3 {
                bottom: 12px;
                right: 26px;
                font-size: 1.25rem;
                animation-delay: 1.1s;
            }

            /* Estilo base de burbuja + animación*/
            .bubble {
                position: absolute;
                z-index: 0;
                border-radius: 999px;
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .28);
                box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45);
                pointer-events: none;

                /* mejor compatibilidad */
                -webkit-backdrop-filter: blur(2px);
                backdrop-filter: blur(2px);

                animation: floaty 6s ease-in-out infinite;
            }

            /* Posición de cada burbuja*/
            .b1 {
                left: -16px;
                top: -18px;
                animation-delay: 0s;
                transform: rotate(5deg);
                width: 84px;
                height: 84px;
            }

            .b2 {
                left: 40px;
                bottom: -22px;
                width: 52px;
                height: 52px;
                animation-delay: .8s;
            }

            .b3 {
                right: -22px;
                bottom: -26px;
                width: 76px;
                height: 76px;
                animation-delay: 1.3s;
            }

            /* Movimiento flotante*/
            @keyframes floaty {
                0%,
                100% {
                    transform: translateY(0) scale(1);
                }

                50% {
                    transform: translateY(-8px) scale(1.03);
                }
            }

            /* NAV */
            .nav {
                display: flex;
                gap: 10px;
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                padding: 10px;
                border-radius: 18px;
                margin-bottom: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-btn {
                border: 1px solid #bfdbfe;
                background: #ffffff;
                border-radius: 999px;
                padding: 8px 12px;
                cursor: pointer;
                font-weight: 700;
                font-size: 0.95rem;
                transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.1s ease;
                min-width: 120px;
            }

            .nav-btn:hover {
                transform: translateY(-1px);
                background: #e0f2fe;
                border-color: #93c5fd;
            }

            .nav-btn.active {
                background: linear-gradient(90deg, #60a5fa, #2563eb);
                color: #fff;
                border-color: transparent;
            }

            h1 {
                margin: 0 0 4px 0;
                text-align: center;
                font-size: 1.5rem;
            }

            .subtitle {
                text-align: center;
                font-size: 0.9rem;
                color: #6b7280;
                margin-bottom: 14px;
            }

            .status-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
                padding: 8px 12px;
                border-radius: 999px;
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                font-size: 0.9rem;
            }

            .xp,
            .hearts {
                display: flex;
                align-items: center;
                gap: 4px;
                font-weight: 600;
            }

            .xp span {
                color: #16a34a;
            }

            .hearts span {
                color: #f97316;
            }

            .progress-wrapper {
                margin-bottom: 14px;
            }

            .progress-label {
                display: flex;
                justify-content: space-between;
                font-size: 0.8rem;
                color: #6b7280;
                margin-bottom: 4px;
            }

            .progress {
                width: 100%;
                height: 10px;
                background: #e5e7eb;
                border-radius: 999px;
                overflow: hidden;
            }

            .progress-inner {
                height: 100%;
                width: 0%;
                border-radius: 999px;
                background: linear-gradient(90deg, #60a5fa, #2563eb);
                transition: width 0.2s ease;
            }

            .card {
                border-radius: 20px;
                padding: 5px;
                background: #f9fafb;
                border: 1px solid #e5e7eb;
                margin-bottom: 5px;
                transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            }

            .card.correct {
                animation: pulse 0.4s ease;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
            }

            .card.wrong {
                animation: shake 0.3s ease;
                border-color: #ef4444;
                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3);
            }

            @keyframes pulse {
                0% { transform: scale(1) }
                50% { transform: scale(1.03) }
                100% { transform: scale(1) }
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0) }
                20% { transform: translateX(-4px) }
                40% { transform: translateX(4px) }
                60% { transform: translateX(-4px) }
                80% { transform: translateX(4px) }
            }

            .emoji-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 12px;
                margin-bottom: 6px;
            }

            .emoji {
                font-size: 5rem;
                text-align: center;
            }

            .speak-btn {
                font-size: 1.6rem;
                cursor: pointer;
                background: #eff6ff;
                border-radius: 999px;
                border: 1px solid #bfdbfe;
                padding: 6px 10px;
                transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;

            .speak-btn:hover {
                transform: scale(1.1);
                background: #dbeafe;
                border-color: #93c5fd;
            }

            .word {

                font-size: 1.6rem;
                font-weight: 700;
                margin-bottom: 2px;

            .translation {

                font-size: 0.95rem;
                color: #6b7280;
                margin-bottom: 12px;

            .example-es,

            .label {
                font-weight: 600;
            }

            .question {
                margin-top: 12px;
                font-weight: 700;
                color: #111827;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 10px;

                border: none;

                font-size: 0.95rem;

                color: #ffffff;
                font-weight: 600;
                letter-spacing: 0.02em;

            }

            button.main-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);

            }

            .feedback {
                margin-top: 10px;
                font-size: 0.95rem;
                text-align: center;
                min-height: 5px;
                font-weight: 600;
            }

            .feedback.good {
                color: #16a34a;
            }

            .feedback.bad {
                color: #ef4444;
            }

            .options {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 12px;
            }

            .option-btn {
                flex: 1;
                min-width: 80px;
                border-radius: 14px;
                border: 1px solid #d1d5db;
                background: #ffffff;
                padding: 8px 10px;
                font-size: 0.9rem;
                cursor: pointer;
                transition: background 0.15s ease, transform 0.1s ease, border 0.1s ease, opacity 0.1s ease;
                font-weight: 600;
            }

            .option-btn:hover:not(:disabled) {
                background: #e0f2fe;
                transform: translateY(-1px);
                border-color: #93c5fd;
            }

            .option-btn:disabled {
                cursor: default;
                opacity: 0.6;
            }

            /* Secciones */
            .section { display: none; }
            .section.active { display: block; }

            /* Tarjetas placeholder */
            .placeholder-title {
                text-align: center;
                font-size: 1.2rem;
                font-weight: 800;
                margin: 6px 0 2px;
            }

            .placeholder-text {
                text-align: center;
                color: #6b7280;
                margin: 0;
            }
