                bottom: 12px;
                right: 26px;
                font-size: 1.25rem;

            }

                z-index: 0;
                border-radius: 999px;
                background: rgba(255, 255, 255, .22);
                border: 1px solid rgba(255, 255, 255, .28);
                box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45);
                pointer-events: none;

                /* mejor compatibilidad */
                -webkit-backdrop-filter: blur(2px);
                backdrop-filter: blur(2px);

                animation: floaty 6s ease-in-out infinite;
            }

            /* Posición de cada burbuja*/
            .b1 {
                left: -16px;
                top: -18px;
                animation-delay: 0s;
                transform: rotate(5deg);
                width: 84px;
                height: 84px;
            }

            .b2 {
                left: 40px;
                bottom: -22px;
                width: 52px;
                height: 52px;
                animation-delay: .8s;
            }

            .b3 {
                right: -22px;
                bottom: -26px;
                width: 76px;
                height: 76px;
                animation-delay: 1.3s;
            }
