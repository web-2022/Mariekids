const LEVEL_CONFIG = {
  basico: {
    label: "Fácil",
    promptPrefix: "Nivel básico. ",
    idOffset: 100
  },
  intermedio: {
    label: "Intermedio",
    promptPrefix: "Nivel intermedio. ",
    idOffset: 200
  },
  avanzado: {
    label: "Avanzado",
    promptPrefix: "Nivel avanzado. ",
    idOffset: 300
  }
};

const EXAM_DISTRIBUTION = {
  basico: 5,
  intermedio: 10,
  avanzado: 5
};

const EXAM_SIZE = EXAM_DISTRIBUTION.basico + EXAM_DISTRIBUTION.intermedio + EXAM_DISTRIBUTION.avanzado;
const EXAM_MINUTES = 30;

function buildQuestion(seed, topicBank, level, index){
  const cfg = LEVEL_CONFIG[level];
  return {
    id: topicBank.temaId * 1000 + cfg.idOffset + index + 1,
    temaId: topicBank.temaId,
    tema: topicBank.tema,
    nivel: level,
    nivelLabel: cfg.label,
    prompt: cfg.promptPrefix + seed.prompt,
    word: seed.word,
    answer: seed.answer,
    options: [...seed.options],
    explain: seed.explain
  };
}

function buildSubBanks(){
  const out = {};
  Object.entries(TOPIC_SEEDS).forEach(([key, topicBank]) => {
    out[key] = {
      temaId: topicBank.temaId,
      tema: topicBank.tema,
      basico: topicBank.seeds.map((seed, index) => buildQuestion(seed, topicBank, "basico", index)),
      intermedio: topicBank.seeds.map((seed, index) => buildQuestion(seed, topicBank, "intermedio", index)),
      avanzado: topicBank.seeds.map((seed, index) => buildQuestion(seed, topicBank, "avanzado", index))
    };
  });
  return out;
}

const QUESTION_SUB_BANKS = buildSubBanks();

function getAllQuestionsByLevel(level){
  return Object.values(QUESTION_SUB_BANKS).flatMap(topicBank => topicBank[level].map(q => ({...q, options:[...q.options]})));
}

function getAllQuestions(){
  return Object.values(QUESTION_SUB_BANKS).flatMap(topicBank => [
    ...topicBank.basico,
    ...topicBank.intermedio,
    ...topicBank.avanzado
  ]);
}

const QUESTION_BANK = getAllQuestions();

function levelLabel(level){
  return LEVEL_CONFIG[level] ? LEVEL_CONFIG[level].label : level;
}

let examQuestions = [];
let answers = {};
let finished = false;
let timeLeft = EXAM_MINUTES * 60;
let timerId = null;

function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function letter(i){ return String.fromCharCode(65+i); }

function generateNewExam(){
  if(!finished && Object.keys(answers).length > 0){
    if(!confirm("¿Quieres generar otro examen? Se perderán tus respuestas actuales.")) return;
  }
  finished = false;
  answers = {};
  const basicQuestions = shuffleArray(getAllQuestionsByLevel("basico")).slice(0, EXAM_DISTRIBUTION.basico);
  const intermediateQuestions = shuffleArray(getAllQuestionsByLevel("intermedio")).slice(0, EXAM_DISTRIBUTION.intermedio);
  const advancedQuestions = shuffleArray(getAllQuestionsByLevel("avanzado")).slice(0, EXAM_DISTRIBUTION.avanzado);

  examQuestions = shuffleArray([
    ...basicQuestions,
    ...intermediateQuestions,
    ...advancedQuestions
  ]).map(q => ({
    ...q,
    options: shuffleArray([...q.options])
  }));
  timeLeft = EXAM_MINUTES * 60;
  document.getElementById("results").style.display = "none";
  renderExam();
  updateProgress();
  startTimer();
}

function startTimer(){
  if(timerId) clearInterval(timerId);
  updateTimer();
  timerId = setInterval(() => {
    if(finished) return;
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timerId);
      finishExam(true);
    }
  }, 1000);
}

function updateTimer(){
  const min = Math.floor(timeLeft / 60);
  const sec = timeLeft % 60;
  document.getElementById("timer").textContent = `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function renderExam(){
  const panel = document.getElementById("examPanel");
  panel.innerHTML = examQuestions.map((q, idx) => {
    const selected = answers[q.id];
    return `
      <div class="question-card" id="q-${q.id}">
        <div class="question-head">
          <div class="question-title">Pregunta ${idx + 1} de ${EXAM_SIZE}</div>
          <div class="topic-tag">${q.tema} · ${levelLabel(q.nivel)}</div>
        </div>
        <div class="question-text">${q.prompt}</div>
        <div class="big-word">${q.word || ""}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option-btn ${selected === opt ? "selected" : ""}" onclick="selectAnswer(${q.id}, '${escapeAttr(opt)}', this)" ${finished ? "disabled" : ""}>
              <b>${letter(i)})</b> ${opt}
            </button>
          `).join("")}
        </div>
      </div>`;
  }).join("");
}

function escapeAttr(s){
  return String(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}

function selectAnswer(id, ans, btn){
  if(finished) return;
  ans = ans.replace(/&#39;/g,"'").replace(/&quot;/g,'"');
  answers[id] = ans;

  const card = document.getElementById("q-" + id);
  card.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  updateProgress();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  document.getElementById("progressText").textContent = `${done}/${EXAM_SIZE}`;
  document.getElementById("progressBar").style.width = (done / EXAM_SIZE * 100) + "%";
}

function finishExam(auto=false){
  if(finished) return;
  if(!auto && Object.keys(answers).length < EXAM_SIZE){
    if(!confirm("Aún faltan preguntas. ¿Deseas finalizar de todos modos?")) return;
  }
  finished = true;
  if(timerId) clearInterval(timerId);

  let correct = 0;
  let wrong = 0;
  let blank = 0;

  examQuestions.forEach(q => {
    if(!answers[q.id]){
      blank++;
    } else if(answers[q.id] === q.answer){
      correct++;
    } else {
      wrong++;
    }
  });

  const pointsCorrect = correct * 10;
  const pointsWrong = wrong * -2;
  const pointsBlank = blank * 0;
  const totalPoints = pointsCorrect + pointsWrong + pointsBlank;

  // Nota del 1 al 20:
  // 20 correctas = 200 puntos = nota 20.
  // La nota se limita entre 1 y 20.
  const rawGrade = totalPoints / 10;
  const grade = Math.max(1, Math.min(20, rawGrade));
  const gradeText = Number.isInteger(grade) ? String(grade) : grade.toFixed(1);

  let performanceTitle = "";
  let performanceMsg = "";
  let performanceIcon = "";
  let performanceClass = "";

  if(grade >= 18){
    performanceIcon = "🌟";
    performanceTitle = "¡Felicitaciones!";
    performanceMsg = "Rendimiento excelente. Dominas muy bien los temas de Comunicación.";
    performanceClass = "excellent";
  } else if(grade >= 14){
    performanceIcon = "👏";
    performanceTitle = "¡Bien hecho!";
    performanceMsg = "Rendimiento bueno. Sigue practicando para llegar al nivel excelente.";
    performanceClass = "good";
  } else if(grade >= 11){
    performanceIcon = "💪";
    performanceTitle = "Vas por buen camino";
    performanceMsg = "Rendimiento regular. Repasa los temas donde tuviste errores.";
    performanceClass = "regular";
  } else {
    performanceIcon = "📚";
    performanceTitle = "Estudia más";
    performanceMsg = "Necesitas repasar con calma y volver a intentarlo.";
    performanceClass = "study";
  }

  const recommendedTopics = [...new Set(
    examQuestions
      .filter(q => !answers[q.id] || answers[q.id] !== q.answer)
      .map(q => q.tema)
  )];

  renderExam();

  examQuestions.forEach(q => {
    const card = document.getElementById("q-" + q.id);
    card.querySelectorAll(".option-btn").forEach(btn => {
      const txt = btn.textContent.trim().replace(/^[A-E]\)\s*/,"").trim();
      if(txt === q.answer) btn.classList.add("correct-choice");
      if(answers[q.id] && txt === answers[q.id] && answers[q.id] !== q.answer) btn.classList.add("wrong-choice");
      btn.disabled = true;
    });
  });

  const results = document.getElementById("results");
  results.style.display = "block";
  results.innerHTML = `
    <h2>${auto ? "⏱️ Tiempo terminado" : "🏁 Examen finalizado"}</h2>

    <div class="score-grid">
      <div class="score-card grade-card">
        <div class="score-label">Nota</div>
        <div class="score-value">${gradeText}<span>/20</span></div>
      </div>

      <div class="score-card">
        <div class="score-label">Puntaje</div>
        <div class="score-value">${totalPoints}<span> puntos</span></div>
      </div>
    </div>

    <div class="performance-box ${performanceClass}">
      <div class="performance-icon">${performanceIcon}</div>
      <div>
        <div class="performance-title">${performanceTitle}</div>
        <div class="performance-msg">${performanceMsg}</div>
      </div>
    </div>

    <div class="score-detail">
      <b>Detalle del puntaje:</b><br>
      ✅ Correctas: ${correct} × 10 = ${pointsCorrect} puntos<br>
      ❌ Incorrectas: ${wrong} × -2 = ${pointsWrong} puntos<br>
      ⚪ No marcadas: ${blank} × 0 = ${pointsBlank} puntos<br>🎯 Distribución: 5 fáciles · 10 intermedias · 5 avanzadas
    </div>

    <div class="recommendation-box">
      <div class="recommendation-title">📌 Recomendación</div>
      <div class="recommendation-text">
        ${recommendedTopics.length
          ? `Estudia los siguientes temas: <b>${recommendedTopics.join(" · ")}</b>.`
          : "Excelente. No necesitas repasar temas específicos de este examen."}
      </div>
    </div>

    <div class="review-item">
      <b>Temas evaluados en este examen:</b><br>
      ${examQuestions.map(q => q.tema).join(" · ")}
    </div>

    <h2 style="margin-top:12px;">Revisión</h2>
    ${examQuestions.map((q, idx) => `
      <div class="review-item">
        <b>${idx+1}. ${q.tema} · ${levelLabel(q.nivel)}</b><br>
        Tu respuesta:
        <span class="${answers[q.id] === q.answer ? "review-good" : "review-bad"}">
          ${answers[q.id] || "Sin responder"}
        </span><br>
        Respuesta correcta: <span class="review-good">${q.answer}</span><br>
        ${q.explain}
      </div>
    `).join("")}
  `;

  results.scrollIntoView({behavior:"smooth", block:"start"});
}
