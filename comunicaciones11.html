function visualExampleHTML(text){
const item=exampleCards[text]||{icon:"🖼️",kind:"look",title:"Observa",chips:[text],explain:"Lee con atención y usa la pista para responder."};
const chipClass=item.kind==="check"?"warn":"good";
return `<div class="image-card ${item.kind}"><div class="image-emoji">${item.icon}</div><div class="image-title">${item.title}</div><div>${item.chips.map(x=>`<span class="image-chip ${chipClass}">${x}</span>`).join("")}</div><div class="mini-explain">${item.explain}</div></div>`;
}
function buildTheoryHeader(){return `<div class="theory-header"><div class="rule-card dip"><div class="rule-card-title">📘 Aprender</div><div class="rule-card-text">Leo la explicación y reconozco la pista.</div></div><div class="rule-card hia"><div class="rule-card-title">✅ Resolver</div><div class="rule-card-text">Marco la respuesta correcta según el tema.</div></div></div>`;}

function cleanForSpeech(text){
  return String(text || "")
    .replace(/<[^>]+>/g," ")
    .replace(/[^\wáéíóúÁÉÍÓÚñÑüÜ¿?.,;:¡! ]/g," ")
    .replace(/→/g," se lee ")
    .replace(/·/g,". ")
    .replace(/\s+/g," ")
    .trim();
}

function speakText(text){
  if(!("speechSynthesis" in window)){
    alert("Tu navegador no permite audio automático.");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
  const voices = window.speechSynthesis.getVoices();
  u.voice = voices.find(v => v.lang === "es-PE")
    || voices.find(v => v.lang === "es-419")
    || voices.find(v => v.lang && v.lang.startsWith("es"))
    || null;
  u.lang = "es-PE";
  u.rate = 0.88;
  u.pitch = 1.02;
  window.speechSynthesis.speak(u);
}

function speakTheory(moduleName){
  const m = modules[moduleName];
  if(!m) return;
  const text = [
    m.title,
    m.theory,
    "Pasos:",
    ...(m.steps || [])
  ].join(". ");
  speakText(text);
}

function speakExamples(moduleName){
  const m = modules[moduleName];
  if(!m) return;
  const text = [
    "Ejemplos visuales del módulo.",
    ...(m.examples || [])
  ].join(". ");
  speakText(text);
}

function buildPage(){
const tabs=document.getElementById("tabs"),cont=document.getElementById("modulesContainer");
order.forEach((name,i)=>{
const b=document.createElement("button");b.className="tab-btn"+(i===0?" active":"");b.id="tab-"+name;b.textContent=modules[name].tab;b.onclick=()=>showModule(name);tabs.appendChild(b);
const s=document.createElement("section");s.className="module"+(i===0?" active":"");s.id="module-"+name;
if(name==="olimpiadas"){s.innerHTML=`<div class="panel practice"><h2 class="panel-title">${modules[name].title}</h2><div class="summary-box" style="margin-bottom:12px;">Prueba de nivel interescolar: 20 ejercicios de menor a mayor nivel sobre lectura de oraciones cortas.</div><div class="question-card" id="practice-${name}"></div></div>`;}
else{s.innerHTML=`<div class="panel theory"><h2 class="panel-title">${modules[name].title}</h2><div class="theory-audio-row"><button class="audio-small-btn" onclick="speakTheory(\'${name}\')">🔊 Escuchar teoría</button></div>${buildTheoryHeader()}<div class="rule">${modules[name].theory}</div><div class="chip-row">${modules[name].demo.map(x=>`<span class="chip">${x}</span>`).join("")}</div><div class="steps">${modules[name].steps.map((x,j)=>`<div class="step">${j+1}️⃣ ${x}</div>`).join("")}</div></div><div class="panel examples"><h2 class="panel-title">👀 Ejemplos visuales</h2><div class="visual-note">Lee el ejemplo y observa la pista:<div class="legend"><span class="legend-pill green">Verde = correcto</span><span class="legend-pill orange">Naranja = pista</span></div></div><div class="theory-audio-row"><button class="audio-small-btn purple" onclick="speakExamples(\'${name}\')">🔊 Escuchar explicación de imágenes</button></div><div class="visual-examples-grid" id="examples-${name}"></div></div><div class="panel practice"><h2 class="panel-title">✏️ 10 ejercicios</h2><div class="question-card" id="practice-${name}"></div></div>`;}
cont.appendChild(s);
});
}
function showModule(name){state.currentModule=name;document.querySelectorAll(".module").forEach(m=>m.classList.remove("active"));document.getElementById("module-"+name).classList.add("active");document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));document.getElementById("tab-"+name).classList.add("active");renderPractice(name);}
function renderExampleButtons(){order.forEach(name=>{if(name==="olimpiadas")return;const c=document.getElementById("examples-"+name);if(!c)return;c.innerHTML="";modules[name].examples.forEach(text=>c.insertAdjacentHTML("beforeend",visualExampleHTML(text)));});}
function renderPractice(moduleName){
const data=modules[moduleName],target=document.getElementById("practice-"+moduleName);if(!target)return;
const idx=state.index[moduleName],qq=data.questions[idx];target.innerHTML="";
if(!qq){target.innerHTML=`<div class="question-title">🎉 Terminaste este módulo</div><div class="feedback good">Muy bien.</div><div class="controls"><button class="main-btn" onclick="goNextModule('${moduleName}')">Siguiente</button><button class="main-btn secondary" onclick="shareApp()">📤 Compartir app</button></div>`;return;}
const opts=[...qq.options];shuffleArray(opts);
target.innerHTML=`<div class="question-title">Ejercicio ${idx+1} de ${data.questions.length}</div><div class="question-text">${qq.prompt}</div><div class="big-word">${qq.word||""}</div><div class="options">${opts.map(o=>`<button class="option-btn" onclick="checkAnswer('${moduleName}','${escapeAttr(o)}',this)">${o}</button>`).join("")}</div><div class="feedback" id="feedback-${moduleName}"></div><div class="controls"><button class="main-btn" onclick="nextQuestion('${moduleName}')">Siguiente</button><button class="main-btn secondary" onclick="shareApp()">📤 Compartir app</button></div>`;
}
function escapeAttr(s){return String(s).replace(/'/g,"&#39;");}
function checkAnswer(moduleName,answer,btn){
answer=answer.replace(/&#39;/g,"'");
const qq=modules[moduleName].questions[state.index[moduleName]],fb=document.getElementById("feedback-"+moduleName);
if(!qq||state.answered[moduleName].has(state.index[moduleName]))return;
if(answer===qq.answer){state.answered[moduleName].add(state.index[moduleName]);state.correct++;btn.classList.add("correct-choice");fb.textContent="✅ Muy bien. "+qq.explain;fb.className="feedback good";if(moduleName==="olimpiadas"){speakText("Muy bien. Respuesta correcta.");}disableOptions(moduleName,qq.answer);updateProgress();}
else{state.wrong++;btn.classList.add("wrong-choice");btn.disabled=true;fb.textContent="❌ Incorrecto. Intenta otra vez.";fb.className="feedback bad";if(moduleName==="olimpiadas"){speakText("Incorrecto. Intenta otra vez.");}updateProgress();}
}
function disableOptions(moduleName,correct){document.getElementById("practice-"+moduleName).querySelectorAll(".option-btn").forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add("correct-choice");});}
function nextQuestion(moduleName){if(!state.answered[moduleName].has(state.index[moduleName])){const fb=document.getElementById("feedback-"+moduleName);if(fb){fb.textContent="👉 Primero responde correctamente para avanzar.";fb.className="feedback bad";}return;}state.index[moduleName]++;renderPractice(moduleName);}
function goNextModule(moduleName){showModule(order[order.indexOf(moduleName)+1]||"olimpiadas");}
function updateProgress(){document.getElementById("correctCount").textContent=state.correct;document.getElementById("wrongCount").textContent=state.wrong;const done=Object.values(state.answered).reduce((s,set)=>s+set.size,0);document.getElementById("progressText").textContent=`${done}/${state.totalQuestions}`;document.getElementById("progressBar").style.width=(done/state.totalQuestions*100)+"%";}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function shareApp(){const data={title:"Marie Kids - Lectura de oraciones cortas",text:"🖼️ Practica lectura de imágenes y oraciones.",url:window.location.href};if(navigator.share){navigator.share(data).catch(()=>{});}else{navigator.clipboard.writeText(data.url);alert("🔗 Link copiado para compartir");}}
buildPage();renderExampleButtons();order.forEach(renderPractice);updateProgress();
