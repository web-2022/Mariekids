<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Juego para Pintar</title>

        <style>
            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                margin: 0;
                font-family: "Segoe UI", sans-serif;
                min-height: 100dvh;
                background: linear-gradient(180deg, #ffe4f3, #dbeafe);
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                user-select: none;
            }

            .app {
                width: 100vw;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }

            header {
                background: linear-gradient(135deg, #f472b6, #8b5cf6);
                color: white;
                padding: 12px;
                border-radius: 18px;
                text-align: center;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            }

            header h1 {
                margin: 0;
                font-size: clamp(20px, 5vw, 34px);
            }

            #maskCanvas {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .toolbar {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                background: rgba(255, 255, 255, 0.75);
                border-radius: 18px;
                padding: 10px;
            }

            .color {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: 3px solid white;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                cursor: pointer;
            }

            .color.active {
                outline: 4px solid #7c3aed;
                transform: scale(1.12);
            }

            button {
                border: none;
                border-radius: 999px;
                padding: 10px 14px;
                font-weight: 800;
                cursor: pointer;
                background: white;
                color: #6d28d9;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            }

            button:active {
                transform: scale(0.96);
            }

            .sizeBox {
                display: flex;
                align-items: center;
                gap: 6px;
                color: #6d28d9;
                font-weight: 800;
            }

            input[type="range"] {
                width: 110px;
            }

            .canvasWrap {
                flex: 1;
                position: relative;
                background: white;
                border-radius: 22px;
                overflow: hidden;
                border: 4px solid rgba(255, 255, 255, 0.9);
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
                touch-action: none;
            }

            canvas {
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
            }

            #paintCanvas {
                background: white;
            }

            #maskCanvas {
                display: none;
            }

            .guide {
                position: absolute;
                inset: 0;
                pointer-events: none;
                opacity: 0.22;
            }

            .guide svg {
                width: 100%;
                height: 100%;
            }

            footer {
                text-align: center;
                font-size: 13px;
                color: #6d28d9;
                font-weight: 700;
            }

            @media (max-width: 480px) {
                .app {
                    padding: 6px;
                    gap: 6px;
                }

                .toolbar {
                    padding: 8px;
                    gap: 6px;
                }

                .color {
                    width: 32px;
                    height: 32px;
                }

                button {
                    padding: 8px 11px;
                    font-size: 13px;
                }
            }
        </style>
    </head>

    <body>
        <div class="app">
            <header>
                <h1>🎨 Juego para Pintar</h1>
            </header>

            <div class="toolbar">
                <div class="color active" data-color="#ef4444" style="background:#ef4444"></div>
                <div class="color" data-color="#f97316" style="background:#f97316"></div>
                <div class="color" data-color="#facc15" style="background:#facc15"></div>
                <div class="color" data-color="#22c55e" style="background:#22c55e"></div>
                <div class="color" data-color="#38bdf8" style="background:#38bdf8"></div>
                <div class="color" data-color="#6366f1" style="background:#6366f1"></div>
                <div class="color" data-color="#a855f7" style="background:#a855f7"></div>
                <div class="color" data-color="#ec4899" style="background:#ec4899"></div>
                <div class="color" data-color="#000000" style="background:#000000"></div>

                <button id="eraserBtn">🧽 Borrador</button>
                <button id="clearBtn">🗑️ Limpiar</button>
                <button id="saveBtn">💾 Guardar</button>
                <button onclick="location.href='index.html'">🏠 Inicio</button>

                <div class="sizeBox">
                    Pincel
                    <input type="range" id="sizeRange" min="3" max="40" value="14">
                </div>
            </div>

            <div class="canvasWrap">
                <canvas id="paintCanvas"></canvas>
                <canvas id="maskCanvas"></canvas>

                <div class="guide" id="guide">
                    <svg viewBox="0 0 500 500">
                        <circle cx="250" cy="245" r="120" fill="none" stroke="#000" stroke-width="10" />
                        <circle cx="205" cy="210" r="14" fill="#000" />
                        <circle cx="295" cy="210" r="14" fill="#000" />
                        <path d="M210 285 Q250 330 290 285" fill="none" stroke="#000" stroke-width="10"
                            stroke-linecap="round" />
                        <path d="M250 120 L220 60 L285 105 L335 55 L325 130" fill="none" stroke="#000" stroke-width="10"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M145 170 Q90 125 95 210 Q115 200 145 220" fill="none" stroke="#000"
                            stroke-width="10" />
                        <path d="M355 170 Q410 125 405 210 Q385 200 355 220" fill="none" stroke="#000"
                            stroke-width="10" />
                        <path d="M175 355 Q250 420 325 355" fill="none" stroke="#000" stroke-width="10" />
                    </svg>
                </div>
            </div>

            <footer>
                Toca la pantalla y pinta con tu dedo ✨
            </footer>
        </div>

        <script>
            const canvas = document.getElementById("paintCanvas");
            const ctx = canvas.getContext("2d");

            const maskCanvas = document.createElement("canvas");
            const maskCtx = maskCanvas.getContext("2d");

            const colors = document.querySelectorAll(".color");
            const eraserBtn = document.getElementById("eraserBtn");
            const clearBtn = document.getElementById("clearBtn");
            const saveBtn = document.getElementById("saveBtn");
            const sizeRange = document.getElementById("sizeRange");

            let painting = false;
            let currentColor = "#ef4444";
            let brushSize = 14;
            let erasing = false;
            let dpr = window.devicePixelRatio || 1;

            function resizeCanvas() {
                dpr = window.devicePixelRatio || 1;

                canvas.width = canvas.offsetWidth * dpr;
                canvas.height = canvas.offsetHeight * dpr;

                maskCanvas.width = canvas.width;
                maskCanvas.height = canvas.height;

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                drawMask();
            }

            function drawMask() {
                maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);

                const w = canvas.offsetWidth;
                const h = canvas.offsetHeight;

                maskCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                maskCtx.fillStyle = "black";

                maskCtx.beginPath();
                maskCtx.arc(w / 2, h / 2, Math.min(w, h) * 0.24, 0, Math.PI * 2);
                maskCtx.fill();
            }

            function applyMask() {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.globalCompositeOperation = "destination-in";
                ctx.drawImage(maskCanvas, 0, 0);
                ctx.restore();

                ctx.globalCompositeOperation = "source-over";
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;

                return {
                    x: touch.clientX - rect.left,
                    y: touch.clientY - rect.top
                };
            }

            function startPaint(e) {
                e.preventDefault();
                painting = true;

                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            function draw(e) {
                if (!painting) return;
                e.preventDefault();

                const pos = getPos(e);

                ctx.lineWidth = brushSize;
                ctx.strokeStyle = erasing ? "#ffffff" : currentColor;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();

                applyMask();
            }

            function stopPaint() {
                painting = false;
                ctx.beginPath();
            }

            canvas.addEventListener("mousedown", startPaint);
            canvas.addEventListener("mousemove", draw);
            canvas.addEventListener("mouseup", stopPaint);
            canvas.addEventListener("mouseleave", stopPaint);

            canvas.addEventListener("touchstart", startPaint, { passive: false });
            canvas.addEventListener("touchmove", draw, { passive: false });
            canvas.addEventListener("touchend", stopPaint);

            colors.forEach(color => {
                color.addEventListener("click", () => {
                    colors.forEach(c => c.classList.remove("active"));
                    color.classList.add("active");
                    currentColor = color.dataset.color;
                    erasing = false;
                });
            });

            eraserBtn.addEventListener("click", () => {
                erasing = true;
                colors.forEach(c => c.classList.remove("active"));
            });

            clearBtn.addEventListener("click", () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            saveBtn.addEventListener("click", () => {
                const link = document.createElement("a");
                link.download = "mi-dibujo.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            });

            sizeRange.addEventListener("input", () => {
                brushSize = Number(sizeRange.value);
            });

            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();
        </script>
    </body>

</html>
