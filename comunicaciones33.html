d": "sol : día :: luna : ___", "answer": "noche", "options": ["mañana", "noche", "tarde", "verano"], "explain": "El sol se relaciona con el día y la luna con la noche."}, {"prompt": "Completa la analogía.", "word": "maestro : enseñar :: alumno : ___", "answer": "aprender", "options": ["aprender", "cocinar", "manejar", "dormir"], "explain": "El maestro enseña y el alumno aprende."}, {"prompt": "Completa la analogía.", "word": "perro : ladrar :: gato : ___", "answer": "maullar", "options": ["maullar", "mugir", "rugir", "cantar"], "explain": "El perro ladra y el gato maúlla."}, {"prompt": "Completa la analogía.", "word": "pez : nadar :: ave : ___", "answer": "volar", "options": ["volar", "leer", "dormir", "cocinar"], "explain": "El pez nada y el ave vuela."}]}, "uso": {"tab": "2. Uso", "title": "🛠️ 2. Analogías de uso", "theory": "En las analogías de uso, una palabra se relaciona con aquello para lo que sirve. Por ejemplo: lápiz sirve para escribir.", "demo": ["Objeto", "Uso", "Sirve para", "Completar"], "steps": ["Identifico el objeto.", "Pienso para qué sirve.", "Busco otro objeto parecido.", "Completo con su uso correcto."], "examples": ["Escoba es a barrer como lápiz es a escribir.", "Cuchara es a comer como vaso es a beber.", "Llave es a abrir como lápiz es a escribir.", "Tijera es a cortar como aguja es a coser."], "questions": [{"prompt": "Completa la analogía.", "word": "escoba : barrer :: lápiz : ___", "answer": "escribir", "options": ["escribir", "comer", "dormir", "nadar"], "explain": "La escoba sirve para barrer y el lápiz para escribir."}, {"prompt": "Completa la analogía.", "word": "cuchara : comer :: vaso : ___", "answer": "beber", "options": ["beber", "correr", "pintar", "volar"], "explain": "La cuchara ayuda a comer y el vaso a beber."}, {"prompt": "Completa la analogía.", "word": "llave : abrir :: lápiz : ___", "answer": "escribir", "options": ["dormir", "escribir", "cantar", "nadar"], "explain": "La llave sirve para abrir y el lápiz para escribir."}, function visualExampleHTML(text){
const item=exampleCards[text]||{icon:"🖼️",kind:"look",title:"Observa",chips:[text],explain:"Lee con atención y descubre la relación entre palabras."};

function buildTheoryHeader(){return `<div class="theory-header"><div class="rule-card dip"><div class="rule-card-title">🔗 Relacionar</div><div class="rule-card-text">Descubro la relación entre las palabras.</div></div><div class="rule-card hia"><div class="rule-card-title">✍️ Completar</div><div class="rule-card-text">Elijo la palabra que completa la idea.</div></div></div>`;}

function cleanForSpeech(text){
  return String(text || "")
    .replace(/<[^>]+>/g," ")
    .replace(/[^\wáéíóúÁÉÍÓÚñÑüÜ¿?.,;:¡! ]/g," ")
    .replace(/→/g," se lee ")
    .replace(/·/g,". ")
    .replace(/\s+/g," ")
    .trim();
}

function speakText(text){
  if(!("speechSynthesis" in window)){
    alert("Tu navegador no permite audio automático.");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
  const voices = window.speechSynthesis.getVoices();
  u.voice = voices.find(v => v.lang === "es-PE")
    || voices.find(v => v.lang === "es-419")
    || voices.find(v => v.lang && v.lang.startsWith("es"))
    || null;
  u.lang = "es-PE";
  u.rate = 0.88;
  u.pitch = 1.02;
  window.speechSynthesis.speak(u);
}

function speakTheory(moduleName){
  const m = modules[moduleName];
  if(!m) return;
  const text = [
    m.title,
    m.theory,
    "Pasos:",
    ...(m.steps || [])
  ].join(". ");
  speakText(text);
}

function speakExamples(moduleName){
  const m = modules[moduleName];
  if(!m) return;
  const text = [
    "Ejemplos visuales del módulo.",
    ...(m.examples || [])
  ].join(". ");
  speakText(text);
}

function renderPractice(moduleName){

function escapeAttr(s){return String(s).replace(/'/g,"&#39;");}
function checkAnswer(moduleName,answer,btn){
answer=answer.replace(/&#39;/g,"'");
const qq=modules[moduleName].questions[state.index[moduleName]],fb=document.getElementById("feedback-"+moduleName);
if(!qq||state.answered[moduleName].has(state.index[moduleName]))return;

else{state.wrong++;btn.classList.add("wrong-choice");btn.disabled=true;fb.textContent="❌ Incorrecto. Intenta otra vez.";fb.className="feedback bad";if(moduleName==="olimpiadas"){speakText("Incorrecto. Intenta otra vez.");}updateProgress();}
}
function disableOptions(moduleName,correct){document.getElementById("practice-"+moduleName).querySelectorAll(".option-btn").forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add("correct-choice");});}
function nextQuestion(moduleName){if(!state.answered[moduleName].has(state.index[moduleName])){const fb=document.getElementById("feedback-"+moduleName);if(fb){fb.textContent="👉 Primero responde correctamente para avanzar.";fb.className="feedback bad";}return;}state.index[moduleName]++;renderPractice(moduleName);}

function updateProgress(){document.getElementById("correctCount").textContent=state.correct;document.getElementById("wrongCount").textContent=state.wrong;const done=Object.values(state.answered).reduce((s,set)=>s+set.size,0);document.getElementById("progressText").textContent=`${done}/${state.totalQuestions}`;document.getElementById("progressBar").style.width=(done/state.totalQuestions*100)+"%";}
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
